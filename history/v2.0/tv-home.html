<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filmkväll • PiTV</title>
<style>
*{box-sizing:border-box}:root{color-scheme:dark}body{margin:0;background:radial-gradient(circle at 18% 8%,#3d1b49,transparent 48%),radial-gradient(circle at 88% 90%,#193b63,transparent 55%),#0b0c14;color:white;font-family:system-ui,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;overflow:hidden}
main{width:min(1200px,95vw);padding:30px}header{font-weight:800;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:#c5b4ff}h1{margin:14px 0 5px;font-size:clamp(35px,5.6vw,70px);letter-spacing:-.05em}.intro{margin:0 0 38px;color:#aebad3;font-size:clamp(15px,1.7vw,22px)}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.tile{height:min(290px,34vh);text-align:left;display:flex;flex-direction:column;justify-content:end;border:1px solid #ffffff25;border-radius:26px;padding:clamp(18px,2.6vw,36px);color:white;cursor:pointer;box-shadow:0 20px 40px #0008}.tile:focus-visible{outline:6px solid #f8de78;outline-offset:5px;transform:scale(1.025)}.tile b{font-size:clamp(30px,4vw,54px)}.tile span{font-size:clamp(13px,1.6vw,20px);color:#ffffffc7;margin-top:6px}.netflix{background:linear-gradient(145deg,#a60815,#230407)}.disney{background:linear-gradient(145deg,#225ac2,#07162b)}.youtube{background:linear-gradient(145deg,#d62531,#380c11)}footer{margin-top:35px;font-size:16px;color:#aebad3;min-height:24px}@media(max-width:680px){.apps{gap:10px}.tile{padding:13px;height:160px;border-radius:16px}.tile b{font-size:22px}.tile span{font-size:12px}}
</style></head><body><main>
<header>🍿 PiTV Mini • Filmkväll</header><h1>Vad ska vi titta på?</h1><p class="intro">Välj med ← → och OK på mobilfjärrkontrollen</p>
<div class="apps" id="apps">
<button class="tile netflix" data-app="netflix"><b>Netflix</b><span>Filmer och serier</span></button>
<button class="tile disney" data-app="disney"><b>Disney+</b><span>Disney, Pixar och Marvel</span></button>
<button class="tile youtube" data-app="youtube"><b>YouTube</b><span>Videor och favoriter</span></button>
</div><footer id="msg">Netflix och Disney+ spelas i din befintliga Chromium.</footer></main>
<script>
const key=new URLSearchParams(location.search).get('key');const buttons=[...document.querySelectorAll('button[data-app]')];const msg=document.getElementById('msg');
buttons[0].focus();
async function launch(name){msg.textContent='Öppnar '+name+' …';try{const res=await fetch('/action?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:name})});if(!res.ok)throw Error('Fjärrkontrollen svarade '+res.status)}catch(e){msg.textContent='Kunde inte öppna: '+e.message}}
buttons.forEach(b=>b.addEventListener('click',()=>launch(b.dataset.app)));
window.addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft','ArrowUp','ArrowDown'].includes(e.key))return;const index=buttons.indexOf(document.activeElement);let next=index;if(e.key==='ArrowRight'||e.key==='ArrowDown')next=(index+1)%buttons.length;else next=(index+buttons.length-1)%buttons.length;e.preventDefault();buttons[next].focus()},{capture:true});
</script></body></html>
